# After a promotion, merges main back into development. The promotion's merge
# commit exists on main only: without this, development would show as behind
# main. The content is the same, so the merge never conflicts.
name: sync-development

on:
  push:
    branches: [main]

concurrency:
  group: sync-development
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
      - name: Merge main into development
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "development already contains main"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin development
